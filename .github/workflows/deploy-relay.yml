name: Deploy PersonalAuction Relay
on:
  push:
    branches: ["feature/external-relay-build121"]
    paths: ["relay/**", ".github/workflows/deploy-relay.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global wrangler
      - name: Deploy Cloudflare Worker
        working-directory: relay
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f48eb9270f792b0d1b6ea8c332fe1a0b
