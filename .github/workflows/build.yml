name: Build Standalone Auction GUI

on:
  push:
    branches: ["fix/standalone-auction-gui"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build Mod
        run: gradle build --no-daemon
      - name: Upload standalone JARs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: StandaloneAuction
          path: build/libs/StandaloneAuction-*.jar
          if-no-files-found: error
